<body>
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>

  <div id="ui-container">
    <div id="start-menu" class="menu-screen active">
      <div class="glow-orb orb-1"></div>
      <div class="glow-orb orb-2"></div>
      <div class="header-container">
        <div class="badge-tag">PREMIUM 3D EDITION</div>
        <h1 class="main-title">ENDLESS RUNNER</h1>
        <div class="sub-title">THE GOLDEN PATH</div>
      </div>
      <div class="stats-card">
        <div class="stat-box">
          <span class="stat-label">HIGH SCORE</span>
          <span id="menu-high-score" class="stat-value gold-glow">0</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box">
          <span class="stat-label">TOTAL GOLD</span>
          <span id="menu-total-coins" class="stat-value coin-text">🪙 0</span>
        </div>
      </div>
      <div class="action-buttons">
        <button id="btn-play" class="btn-primary gold-btn pulse-glow" type="button">
          <span class="btn-icon">▶</span> RUN NOW
        </button>
        <div class="btn-row">
          <button id="btn-controls" class="btn-secondary" type="button">
            <span class="btn-icon">🎮</span> CONTROLS
          </button>
